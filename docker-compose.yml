services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: testing
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3309:3306"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    # expose only for local testing; on VPS remove this
    ports:
      - "6379:6379"

  web:
    build: ./backend
    restart: always
    command: >
      gunicorn clinic_backend.wsgi:application --bind 0.0.0.0:8000 --workers 16 --max-requests 600 --max-requests-jitter 150
    volumes:
      - static_volume:/var/www/test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  ws:
    build: ./backend
    restart: always
    command: daphne -b 0.0.0.0 -p 8001 clinic_backend.asgi:application
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  frontend:
    build: ./frontend
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8084:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/test:ro
    depends_on:
      - web
      - ws
      - frontend

volumes:
  mysql_data:
  redis_data:
  static_volume:
