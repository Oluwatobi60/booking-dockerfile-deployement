upstream backend_http { server web:8000; }
upstream backend_ws   { server ws:8001; }
upstream frontend_app { server frontend:80; }

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    location /static/ {
        alias /var/www/isalu/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/isalu/media/;
    }

    location /ws/ {
        proxy_pass http://backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://backend_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # Django admin moved to /django-admin/
    location /django-admin/ {
        proxy_pass http://backend_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA catch-all (includes /admin, /dashboard, /login, etc.)
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
    }
}
